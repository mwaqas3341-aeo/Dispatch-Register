<!-- Google API Client Library (for OAuth access token) -->
<script src="https://apis.google.com/js/api.js"></script>

<script>
  // ═══════════════════════════════════════════════════
  //  CONFIGURATION – REPLACE THESE WITH YOUR VALUES
  // ═══════════════════════════════════════════════════
  const CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com'; // OAuth client ID
  const SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec'; // Apps Script web app URL

  // OAuth scopes required
  const SCOPES = [
    'https://www.googleapis.com/auth/drive',
    'https://www.googleapis.com/auth/spreadsheets',
    'https://www.googleapis.com/auth/gmail.send',
    'email',
    'profile'
  ].join(' ');

  let accessToken = null;
  let userEmail = null;

  /* ── Google OAuth 2.0 (Implicit flow) ── */
  function loadGapiClient() {
    gapi.load('client:auth2', () => {
      gapi.client.init({
        clientId: CLIENT_ID,
        scope: SCOPES,
        discoveryDocs: [] // not needed for just token
      }).then(() => {
        const authInstance = gapi.auth2.getAuthInstance();
        // Check if user is already signed in
        if (authInstance.isSignedIn.get()) {
          const user = authInstance.currentUser.get();
          onSignIn(user);
        }
      });
    });
  }

  document.getElementById('signInBtn').addEventListener('click', () => {
    gapi.auth2.getAuthInstance().signIn().then(onSignIn, (err) => {
      document.getElementById('signInError').textContent = 'Sign‑in failed: ' + err.error;
      document.getElementById('signInError').style.display = 'block';
    });
  });

  function onSignIn(googleUser) {
    const authResponse = googleUser.getAuthResponse();
    accessToken = authResponse.access_token;
    const profile = googleUser.getBasicProfile();
    userEmail = profile.getEmail();
    document.getElementById('signInScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    bootApp();
  }

  function signOut() {
    const auth2 = gapi.auth2.getAuthInstance();
    auth2.signOut().then(() => {
      accessToken = null;
      userEmail = null;
      document.getElementById('signInScreen').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
    });
  }

  /* ── BACKEND COMMUNICATION ── */
  async function callBackend(action, payload = {}) {
    if (!accessToken) throw new Error('Not authenticated.');
    const formData = new FormData();
    formData.append('action', action);
    formData.append('payload', JSON.stringify(payload));
    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + accessToken
        },
        body: formData
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      return data.result;
    } catch (err) {
      console.error('Backend call failed:', err);
      throw err;
    }
  }

  /* ── ALL ORIGINAL FRONTEND LOGIC (adapted) ── */
  var _adminConfig = { /* default config */ };
  var _allContacts = [];
  var _pendingFile = null;
  var _lastReportData = [];
  var _refreshTimer = null;

  function bootApp() {
    document.getElementById('userEmailTop').textContent = userEmail;
    document.getElementById('userInitial').textContent = userEmail.charAt(0).toUpperCase();
    document.getElementById('reportDate').valueAsDate = new Date();

    // Check if workspace exists
    callBackend('checkUserSetup').then(r => {
      if (r.status === 'READY') {
        loadAdminConfig(() => {
          loadMasterData();
          loadStats();
          fetchDispatchNo();
          startAutoRefresh();
        });
      } else if (r.status === 'SHEET_DELETED') {
        showToast('Workspace deleted. Creating new one...', true);
        runInitSetup();
      } else {
        // NEW_USER – initialize workspace
        runInitSetup();
      }
    }).catch(err => {
      showToast('Initialization error: ' + err.message, true);
    });

    document.getElementById('reportDate').addEventListener('change', fetchDispatchNo);

    // Drag & drop
    var zone = document.getElementById('fileZone');
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      var f = e.dataTransfer.files[0];
      if (f) { document.getElementById('fileInput').files = e.dataTransfer.files; handleFileSelect({files:[f]}); }
    });
  }

  function runInitSetup() {
    showToast('Setting up workspace...');
    callBackend('initializeUserSystem').then(r => {
      if (r.success) {
        showToast('Workspace ready!');
        bootApp(); // reload
      } else {
        showToast('Setup failed: ' + r.error, true);
      }
    }).catch(err => showToast(err.message, true));
  }

  function loadAdminConfig(callback) {
    callBackend('getAdminConfig').then(cfg => {
      _adminConfig = cfg;
      // Apply to UI (org name, department, school types, placeholders) – same as before
      document.getElementById('tbOrgName').textContent = cfg.org_name || 'Dispatch Register';
      document.getElementById('tbDeptName').textContent = cfg.department_name || 'Punjab School Education Department';
      // ... rest of the original config application ...
      if (callback) callback();
    }).catch(err => console.warn('loadAdminConfig:', err));
  }

  function loadMasterData() {

  function loadStats() {

  function fetchDispatchNo() {

    callBackend('getNextDispatchNo', { year: year }).then(n => {

  }

  // Dispatch submission (multi‑office)
  function submitDispatch() {
    // Validation (same as before, but using getSelectedOffices())
    var selectedOffices = getSelectedOffices();
    // ...
    var formData = {
      dispatchNo: document.getElementById('dispatchNo').textContent,
      reportDate: document.getElementById('reportDate').value,
      category: document.getElementById('fCategory').value.trim(),
      selectedOffices: selectedOffices,
      otherOfficeName: document.getElementById('otherOfficeName').value.trim(),
      // ... all other fields
    };

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    document.getElementById('formMsg').innerHTML = '<span class="spin-sm"></span> Saving...';

    function doSubmit(base64, name, mime) {
      formData.fileBase64 = base64 || '';
      formData.fileName = name || '';
      formData.fileMime = mime || '';
      callBackend('processForm', { formData: formData }).then(r => {
        btn.disabled = false;
        document.getElementById('formMsg').innerHTML = '';
        if (r.success) {
          showToast(r.message);
          _resetDispatchForm();
          loadStats();
        } else {
          showToast('Error: ' + r.error, true);
        }
      }).catch(err => {
        btn.disabled = false;
        showToast('Error: ' + err.message, true);
      });
    }

    if (_pendingFile) {
      var reader = new FileReader();
      reader.onload = e => {
        var parts = e.target.result.split(',');
        doSubmit(parts[1], _pendingFile.name, _pendingFile.type);
      };
      reader.readAsDataURL(_pendingFile);
    } else {
      doSubmit('', '', '');
    }
  }

  // Reports (adapted)
  function loadReports() {

  }
