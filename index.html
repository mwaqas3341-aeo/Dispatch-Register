<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AEO Dispatch Portal</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .card { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .col { flex: 1; }
        label { font-weight: 600; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .hidden { display: none; }
        .email-preview { background: #eef2ff; padding: 10px; border-radius: 6px; font-size: 0.85rem; color: #4338ca; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div id="auth-section">
        <h2>AEO Dispatch Portal</h2>
        <button id="auth-btn">Sign in with Google</button>
    </div>

    <div id="dashboard" class="hidden">
        <h2 style="color: #0056b3;">Dispatch # <span id="dispatch-num-display">...</span></h2>
        
        <form id="dispatch-form">
            <div class="row">
                <div class="col"><label>Date</label><input type="date" id="date" required></div>
                <div class="col"><label>Nature</label><select id="nature"><option>Routine</option><option>Urgent</option></select></div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Offices (Ctrl+Click to select multiple)</label>
                    <select id="office-select" multiple size="3" style="height: auto;"></select>
                    <div id="selected-emails" class="email-preview">Select offices to see emails...</div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>School Type</label>
                    <select id="school-type">
                        <option value="govt">Government</option>
                        <option value="private">Private</option>
                    </select>
                </div>
            </div>

            <div id="govt-section">
                <label>EMIS Code</label>
                <div class="row">
                    <input type="text" id="emis-code" placeholder="8-digit code" maxlength="8" style="flex: 3;">
                    <button type="button" id="validate-btn" style="flex: 1;">Validate</button>
                </div>
                <input type="text" id="govt-school-name" readonly placeholder="School Name (Locked)">
            </div>

            <div id="private-section" class="hidden">
                <label>Private School Name</label>
                <input type="text" id="private-school-name">
            </div>

            <label>Details</label>
            <textarea id="details" rows="4" placeholder="Enter report paragraph..."></textarea>

            <label>Upload File</label>
            <input type="file" id="report-file" required>

            <button type="submit" id="submit-btn" style="background:#0056b3; color:white; margin-top:20px;">Generate Dispatch & Email</button>
        </form>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
