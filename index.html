<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEO Dispatch Register</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #0056b3; padding-bottom: 10px; color: #0056b3; }
        .hidden { display: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #004494; }
        #auth-section { text-align: center; margin-top: 50px; }
        #school-name-display { display: block; margin-top: 5px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

    <div class="container">
        <div id="auth-section">
            <h2>Digital Dispatch System</h2>
            <p>Please sign in to connect your Google Workspace.</p>
            <button id="auth-btn">Authorize Google Drive & Sheets</button>
        </div>

        <div id="dashboard" class="hidden">
            <h2>Create New Dispatch</h2>
            
            <form id="dispatch-form">
                <div class="form-group">
                    <label for="emis-code">EMIS Code (Govt Schools):</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="emis-code" pattern="\d{8}" title="Must be exactly 8 digits" placeholder="e.g., 38220000" maxlength="8">
                        <button type="button" id="validate-btn" style="margin-top: 0;">Validate</button>
                    </div>
                    <span id="school-name-display"></span>
                </div>

                <div class="form-group">
                    <label for="subject">Dispatch Subject / Description:</label>
                    <input type="text" id="subject" required placeholder="Enter the subject of the report">
                </div>

                <div class="form-group">
                    <label for="report-file">Upload Report File:</label>
                    <input type="file" id="report-file" required>
                </div>

                <button type="submit" id="submit-btn">Generate Dispatch & Upload</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script
