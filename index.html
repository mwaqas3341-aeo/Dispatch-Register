<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEO Dispatch Portal</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .wrapper { max-width: 600px; margin: 40px auto; }
        
        /* Dashboard Card */
        .card { background: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        
        /* Header & Status */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; background: #dcfce7; color: #166534; }
        
        /* Forms */
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #475569; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        
        .hidden { display: none; }
        #auth-section { text-align: center; padding: 40px; }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="auth-section" class="card">
        <h2>Dispatch Portal</h2>
        <p>Login to access your dispatch registers.</p>
        <button id="auth-btn">Sign in with Google</button>
    </div>

    <div id="dashboard" class="card hidden">
        <div class="header">
            <h3>New Dispatch</h3>
            <span class="badge" id="status-badge">Connected</span>
        </div>

        <form id="dispatch-form">
            <div class="form-group">
                <label>EMIS Code</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="emis-code" maxlength="8" placeholder="Enter 8-digit EMIS">
                    <button type="button" id="validate-btn" style="width: 120px;">Check</button>
                </div>
                <small id="school-name-display" style="color: var(--primary); font-weight: bold;"></small>
            </div>

            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subject" required>
            </div>

            <div class="form-group">
                <label>Upload File</label>
                <input type="file" id="report-file" required>
            </div>

            <button type="submit" id="submit-btn">Send to Log</button>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
